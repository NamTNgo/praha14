name: Podkladová mapa čtvrti (OpenStreetMap)

on:
  schedule:
    - cron: "43 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mapa
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Stáhnout data
        run: python scripts/build_mapa.py
      - name: Uložit změny
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A docs/data/mapa
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizace podkladové mapy"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
