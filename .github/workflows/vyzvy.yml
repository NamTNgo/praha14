name: Výzvy k zapojení (Praha 9)

on:
  schedule:
    - cron: "37 6,15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vyzvy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout data
        run: python scripts/build_vyzvy.py
      - name: Uložit změny
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A docs/data/vyzvy.json docs/data/vyzvy_report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizace výzev k zapojení"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
