name: Průzkum dat škol (jednorázově)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_skoly.py
        continue-on-error: true
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/data/skoly_probe.txt
          git commit -m "Průzkum dat škol" || true
          git push || true
