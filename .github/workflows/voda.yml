name: Voda (odstávky PVK)

on:
  schedule:
    - cron: "*/15 * * * *"   # havárie se mění rychle
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: voda
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout odstávky PVK
        run: python scripts/build_voda.py
      - name: Uložit změny
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data/voda.json docs/data/voda_report.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizace odstávek vody"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
