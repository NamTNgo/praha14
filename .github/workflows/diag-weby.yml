name: Diagnostika webů lékařů

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/diag_weby.py
      - uses: actions/upload-artifact@v4
        with:
          name: weby
          path: diag/weby.json
          retention-days: 3
