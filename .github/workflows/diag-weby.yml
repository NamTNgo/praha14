name: Diagnostika webů lékařů

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/diag_weby.py
      # výsledek do samostatné větve (ne do main) – stáhne se přes git
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan diag-weby
          git rm -rfq --cached .
          git add -f diag/weby.json
          git commit -qm "diagnostika webů lékařů"
          git push -f origin diag-weby
