name: Diagnostika webů lékařů

on:
  workflow_dispatch:
    inputs:
      js:
        description: "Vykreslit weby v prohlížeči (Playwright)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/diag_weby.py
      - if: ${{ inputs.js }}
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
          python scripts/diag_weby_js.py
      # výsledek do samostatné větve (ne do main) – stáhne se přes git
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan diag-weby
          git rm -rfq --cached .
          git add -f diag/weby.json
          [ -f diag/weby_js.json ] && git add -f diag/weby_js.json || true
          git commit -qm "diagnostika webů lékařů"
          git push -f origin diag-weby
