name: VOK Praha 9

on:
  schedule:
    - cron: "40 3 * * 1"   # týdně v pondělí, zachytí nový sezónní harmonogram
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aktualizovat VOK Praha 9
        run: python scripts/scrape_vok9.py
      - name: Uložit změny
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Aktualizace VOK Praha 9" && git push
