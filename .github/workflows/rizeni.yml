name: Stavební řízení (úřední desky Prahy 9 a 14)

on:
  schedule:
    - cron: "41 6,16 * * *"   # vyhlášky přibývají během pracovního dne
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rizeni
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Knihovna na PDF
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pip install pypdf==5.1.0
      - name: Stáhnout vyhlášky stavebních úřadů
        run: python scripts/build_rizeni.py
      - name: Uložit změny
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data/rizeni.json docs/data/rizeni_cache.json docs/data/rizeni_report.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizace stavebních řízení"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
