name: Průzkum zdrojů (jednorázově)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pruzkum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/pruzkum.py
        env:
          GOLEMIO_API_KEY: ${{ secrets.GOLEMIO_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan pruzkum
          git rm -rfq --cached .
          git add -f diag
          git commit -qm "průzkum zdrojů"
          git push -f origin pruzkum
