name: Health-check dat

on:
  schedule:
    - cron: "7 */2 * * *"   # každé 2 hodiny
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # healthcheck čte stáří souborů z historie commitů
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Spustit health-check
        id: hc
        continue-on-error: true
        env:
          NDIC_URL: ${{ secrets.NDIC_URL }}
          NDIC_TOKEN: ${{ secrets.NDIC_TOKEN }}
        run: python scripts/healthcheck.py

      - name: Nahlásit / vyřešit přes Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TITUL="🩺 Monitoring: problém s daty"
          NUM=$(gh issue list --state open --json number,title \
                  --jq ".[] | select(.title==\"$TITUL\") | .number" | head -1)
          if [ -f watch/health.md ]; then
            if [ -n "$NUM" ]; then
              echo "Aktualizuji issue #$NUM"
              gh issue comment "$NUM" --body-file watch/health.md
            else
              echo "Zakládám nové issue"
              gh issue create --title "$TITUL" --body-file watch/health.md
            fi
            exit 1   # ať běh svítí červeně a přijde e-mail
          else
            if [ -n "$NUM" ]; then
              echo "Vše v pořádku → zavírám issue #$NUM"
              gh issue comment "$NUM" --body "✅ Health-check je opět bez chyby, zdroje dodávají data. Zavírám."
              gh issue close "$NUM"
            fi
            echo "Vše v pořádku."
          fi
