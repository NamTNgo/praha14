name: Záměry EIA (CENIA)

on:
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: eia
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout data
        run: python scripts/build_eia.py
      - name: Uložit změny
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A docs/data/eia.json docs/data/eia_report.txt; git add -A docs/data/eia_ladeni.html 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizace záměrů EIA"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
