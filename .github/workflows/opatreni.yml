name: Přechodné úpravy provozu (úřední desky Prahy 9 a 14)

on:
  schedule:
    - cron: "47 6,16 * * *"   # oznámení přibývají během pracovního dne
  workflow_dispatch:
    inputs:
      ladeni:
        description: "Vypsat přečtený text oznámení do logu (znovu načte všechna)"
        default: ""

permissions:
  contents: write

concurrency:
  group: opatreni
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PDF a OCR (čeština)
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ces >/dev/null
          pip install pypdf==5.1.0
      - name: Stáhnout opatření
        env:
          LADENI: ${{ inputs.ladeni }}
        run: |
          if [ -n "$LADENI" ]; then rm -f docs/data/opatreni_cache.json; fi
          python scripts/build_opatreni.py
      - name: Uložit změny
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A docs/data/opatreni.json docs/data/opatreni_cache.json docs/data/opatreni_report.txt "docs/data/opatreni_ladeni.txt" 2>/dev/null || git add -A docs/data/opatreni.json docs/data/opatreni_cache.json docs/data/opatreni_report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizace dopravních opatření"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
