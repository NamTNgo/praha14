name: Dopravní komplikace

on:
  schedule:
    - cron: "40 4 * * *"   # jednou denně, před ranní špičkou
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Stáhnout dopravní omezení
        env:
          GOLEMIO_API_KEY: ${{ secrets.GOLEMIO_API_KEY }}
          NDIC_URL: ${{ secrets.NDIC_URL }}
          NDIC_TOKEN: ${{ secrets.NDIC_TOKEN }}
        run: python scripts/build_doprava.py
      - name: Uložit změny
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Aktualizace dopravních omezení" && git push
