name: Kontejnery na textil (OpenStreetMap)

on:
  schedule:
    - cron: "13 4 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: textil
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Stáhnout data
        run: python scripts/build_textil.py
      - name: Uložit změny
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A docs/data/textil.json
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizace kontejnerů na textil"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
