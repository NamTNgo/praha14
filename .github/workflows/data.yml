name: Denní aktualizace dat

on:
  schedule:
    - cron: "17 5 * * *"   # jednou denně (cca 7:17 / 6:17 praha)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyproj
      - name: Stáhnout data
        env:
          GOLEMIO_API_KEY: ${{ secrets.GOLEMIO_API_KEY }}
        run: python scripts/build_data.py
      - name: Uložit změny
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Aktualizace dat" && git push
