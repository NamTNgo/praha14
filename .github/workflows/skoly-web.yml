name: Údaje z webů škol (termíny, telefon, školné)

on:
  schedule:
    - cron: "17 5 * * 1"   # každé pondělí
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/scrape_skoly.py
      - name: Uložit změny
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Aktualizace údajů z webů škol" && git push
